<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-label {
            opacity: 0.9;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .node-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #667eea;
            transition: transform 0.3s ease;
        }

        .node-card:hover {
            transform: translateY(-5px);
        }

        .node-card.online {
            border-left-color: #28a745;
        }

        .node-card.offline {
            border-left-color: #dc3545;
            opacity: 0.7;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .node-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .node-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-rename {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            color: #666;
        }

        .btn-rename:hover {
            background-color: #f0f0f0;
            color: #333;
        }

        .node-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .node-status.online {
            background: #d4edda;
            color: #155724;
        }

        .node-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .node-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .no-data {
            text-align: center;
            color: #666;
            padding: 40px;
            grid-column: 1/-1;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nodes-grid {
                grid-template-columns: 1fr;
            }

            .node-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ 节点管理</h1>
            <p>监控和管理分布式节点状态</p>
        </div>

        <div class="nav">
            <a href="/" class="nav-btn">🏠 首页</a>
            <a href="/universal-management" class="nav-btn">🎛️ 通用管理</a>
            <a href="/account-status" class="nav-btn">📊 状态监控</a>
            <a href="/flash-trade" class="nav-btn">⚡ Flash Trade</a>
            <a href="/nodes" class="nav-btn">🖥️ 节点管理</a>
            <button class="nav-btn" onclick="loadNodes()" style="background: #28a745; color: white;">🔄 刷新节点</button>
        </div>

        <!-- 统计概览 -->
        <div class="stats-grid" id="statsGrid">
            <!-- 统计卡片将通过JavaScript动态生成 -->
        </div>

        <!-- 节点列表 -->
        <div class="nodes-grid" id="nodesGrid">
            <!-- 节点卡片将通过JavaScript动态生成 -->
        </div>
    </div>

    <script>
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadNodes();

            // 🔧 优化：更频繁的刷新以快速反映节点状态变化
            setInterval(loadNodes, 5000); // 每5秒刷新，快速显示节点上线状态
        });

        // 加载节点数据
        async function loadNodes() {
            try {
                console.log('正在获取节点数据...');

                // 🔧 修改：无痕刷新，不显示加载状态
                const response = await fetch('/api/v1/nodes');
                const data = await response.json();

                console.log('API响应:', data);

                if (data.success) {
                    console.log('节点数据获取成功，节点数量:', Object.keys(data.nodes || {}).length);
                    updateStats(data.nodes || {});
                    displayNodes(data.nodes || {});
                } else {
                    console.error('获取节点数据失败:', data);
                    document.getElementById('nodesGrid').innerHTML = '<div style="text-align: center; color: #666; padding: 40px;">获取节点数据失败</div>';
                }
            } catch (error) {
                console.error('加载节点数据失败:', error);
                displayError();
                document.getElementById('nodesGrid').innerHTML = '<div style="text-align: center; color: #666; padding: 40px;">网络请求失败</div>';
            }
        }

        // 更新统计数据
        function updateStats(nodes) {
            const totalNodes = Object.keys(nodes).length;
            const onlineNodes = Object.values(nodes).filter(node => node.status === 'online').length;
            const offlineNodes = totalNodes - onlineNodes;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalNodes}</div>
                    <div class="stat-label">总节点数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${onlineNodes}</div>
                    <div class="stat-label">在线节点</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${offlineNodes}</div>
                    <div class="stat-label">离线节点</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${onlineNodes > 0 ? ((onlineNodes / totalNodes) * 100).toFixed(1) : 0}%</div>
                    <div class="stat-label">在线率</div>
                </div>
            `;
        }

        // 显示节点列表
        function displayNodes(nodes) {
            const nodesGrid = document.getElementById('nodesGrid');
            
            if (Object.keys(nodes).length === 0) {
                nodesGrid.innerHTML = '<div class="no-data">暂无节点数据</div>';
                return;
            }

            let html = '';
            Object.entries(nodes).forEach(([nodeId, node]) => {
                const statusClass = node.status === 'online' ? 'online' : 'offline';
                const lastSeen = node.last_heartbeat ? new Date(node.last_heartbeat).toLocaleString() : '未知';
                const connectedAt = node.metadata?.start_time ? new Date(node.metadata.start_time).toLocaleString() : '未知';

                console.log('显示节点:', nodeId, node); // 调试信息
                console.log('节点状态:', node.status, '状态类:', statusClass); // 状态调试

                html += `
                    <div class="node-card ${statusClass}">
                        <div class="node-header">
                            <div class="node-name" id="node-name-${nodeId}">${node.friendly_name || nodeId}</div>
                            <div class="node-header-actions">
                                <button class="btn-rename" onclick="renameNode('${nodeId}', '${node.friendly_name || nodeId}')" title="重命名节点">✏️</button>
                                <div class="node-status ${statusClass}">${node.status === 'online' ? '🟢 在线' : '🔴 离线'}</div>
                            </div>
                        </div>

                        <div class="node-info">
                            <div class="info-item">
                                <div class="info-label">节点ID</div>
                                <div class="info-value">${node.node_id}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">地址</div>
                                <div class="info-value">${node.address || 'localhost'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">类型</div>
                                <div class="info-value">被控端</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">连接时间</div>
                                <div class="info-value">${connectedAt}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">最后活跃</div>
                                <div class="info-value">${lastSeen}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">活跃任务</div>
                                <div class="info-value">${node.active_tasks?.length || 0} 个</div>
                            </div>
                        </div>

                        <div style="margin-top: 15px; font-size: 12px; color: #666;">
                            <div><strong>版本:</strong> ${node.metadata?.version || '1.0.0'}</div>
                            <div><strong>活跃账户:</strong> ${node.stats?.active_accounts || 0} 个</div>
                        </div>
                    </div>
                `;
            });

            nodesGrid.innerHTML = html;
        }

        // 显示错误信息
        function displayError() {
            const nodesGrid = document.getElementById('nodesGrid');
            nodesGrid.innerHTML = '<div class="no-data">加载节点数据失败，请稍后重试</div>';
        }

        // 重命名节点
        async function renameNode(nodeId, currentName) {
            const newName = prompt('请输入新的节点名称:', currentName);

            if (newName === null || newName === currentName) {
                return; // 用户取消或没有更改
            }

            if (newName.trim() === '') {
                alert('节点名称不能为空');
                return;
            }

            if (newName.length > 50) {
                alert('节点名称不能超过50个字符');
                return;
            }

            try {
                const response = await fetch(`/api/v1/nodes/${nodeId}/name`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        friendly_name: newName.trim()
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // 更新页面显示
                    const nameElement = document.getElementById(`node-name-${nodeId}`);
                    if (nameElement) {
                        nameElement.textContent = newName.trim();
                    }

                    // 显示成功消息
                    showNotification('节点名称更新成功', 'success');

                    // 刷新节点列表
                    setTimeout(loadNodes, 1000);
                } else {
                    alert('更新失败: ' + data.message);
                }
            } catch (error) {
                console.error('重命名节点失败:', error);
                alert('网络错误，请稍后重试');
            }
        }

        // 显示通知消息
        function showNotification(message, type = 'info') {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;

            // 添加样式
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 6px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                transition: all 0.3s ease;
                ${type === 'success' ? 'background-color: #28a745;' :
                  type === 'error' ? 'background-color: #dc3545;' :
                  'background-color: #17a2b8;'}
            `;

            document.body.appendChild(notification);

            // 3秒后自动移除
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
